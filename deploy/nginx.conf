# Single-origin deployment: static frontend (dist/) + API under /api. No VITE_API_URL needed.
server {
  listen 80;
  server_name oel.example.org;
  root /opt/mh370-open-evidence-lab/dist;

  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri /index.html; }
}
